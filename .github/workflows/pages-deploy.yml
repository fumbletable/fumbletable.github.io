name: "Deploy redirect shell"

# The old Chirpy/Jekyll build was removed on 2026-08-21 when this site was retired.
# All that ships now is index.html + 404.html, which forward to fumbletable.com.
# GitHub Pages serves 404.html for every unmatched path, so every old URL is covered.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the repo root as-is
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
